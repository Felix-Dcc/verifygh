{% comment %}
Verification email, HTML alternative to verify_email.txt.

Written for mail clients, not browsers: table layout, inline styles, no
external stylesheet, no web fonts and no images. Gmail strips <style> blocks in
some views and Outlook renders with Word's engine, so anything clever here
would degrade into something worse than plain text. The button is a padded
anchor because VML-free rounded buttons are the only kind that survive.

The full URL is repeated below the button: clients that strip links, and users
reading on a device that cannot open the mail app's browser, both need it.
{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

<!-- Preheader: the grey line most clients show next to the subject. -->
<div style="display:none; font-size:1px; color:#f4f5f7; max-height:0; overflow:hidden;">
  Verify your email address to activate your {{ brand }} account.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px; background-color:#ffffff; border-radius:12px; border:1px solid #e5e7eb;">

        <tr>
          <td style="padding:32px 32px 0 32px;">
            <div style="font-size:18px; font-weight:600; color:#047857; letter-spacing:-0.2px;">
              {{ brand }}
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 32px 0 32px;">
            <h1 style="margin:0; font-size:20px; line-height:28px; font-weight:600; color:#111827;">
              Verify your email address
            </h1>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 32px 0 32px; font-size:15px; line-height:24px; color:#374151;">
            <p style="margin:0 0 16px 0;">Hello,</p>
            <p style="margin:0 0 16px 0;">
              Thank you for creating your {{ brand }} account.
            </p>
            <p style="margin:0;">
              Please verify your email address to activate your account and access {{ brand }}.
            </p>
          </td>
        </tr>

        <tr>
          <td align="left" style="padding:28px 32px 0 32px;">
            <a href="{{ verify_url }}"
               style="display:inline-block; background-color:#047857; color:#ffffff; font-size:15px; font-weight:600; line-height:20px; text-decoration:none; padding:13px 28px; border-radius:8px;">
              Verify Email
            </a>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 32px 0 32px; font-size:13px; line-height:20px; color:#6b7280;">
            <p style="margin:0 0 8px 0;">
              If the button does not work, copy this link into your browser:
            </p>
            <p style="margin:0; word-break:break-all;">
              <a href="{{ verify_url }}" style="color:#047857; text-decoration:underline;">{{ verify_url }}</a>
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 32px 0 32px;">
            <div style="border-top:1px solid #e5e7eb;"></div>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 32px 32px 32px; font-size:13px; line-height:20px; color:#6b7280;">
            <p style="margin:0 0 8px 0;">
              This link expires in {{ hours }} hours and can only be used once.
            </p>
            <p style="margin:0;">
              If you did not create a {{ brand }} account, you can ignore this email &mdash;
              no account will be activated without this confirmation.
            </p>
          </td>
        </tr>

      </table>

      <div style="max-width:520px; padding:20px 8px 0 8px; font-size:12px; line-height:18px; color:#9ca3af; text-align:center;">
        {{ brand }} &mdash; Verification made simple.
      </div>

    </td>
  </tr>
</table>

</body>
</html>

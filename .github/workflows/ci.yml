name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest

    # The concurrency and double-spend tests only prove something against the
    # database production actually uses. SQLite has no row locks, so locally
    # they exercise the compare-and-set path; here they exercise SELECT ... FOR
    # UPDATE, which is what protects real balances.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verifygh_test
          POSTGRES_USER: verifygh
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifygh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://verifygh:ci-only-not-a-secret@localhost:5432/verifygh_test
      DB_SSLMODE: disable
      # Fail the run outright if the suite would fall back to SQLite.
      REQUIRE_POSTGRES: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest -p no:warnings -rs

      - name: PostgreSQL-only tests actually ran
        run: |
          # A skip here would mean the lock and isolation checks proved nothing.
          pytest tests/test_postgres.py -p no:warnings -rs | tee pg.txt
          if grep -q "skipped" pg.txt; then echo "PostgreSQL tests were skipped"; exit 1; fi

      - name: Production settings refuse unsafe configuration
        run: |
          # Must fail: no secrets supplied.
          if DJANGO_SETTINGS_MODULE=config.settings.prod python -c "import django; django.setup()" 2>/dev/null; then
            echo "prod settings booted without required secrets"; exit 1
          fi
          echo "prod settings correctly refused to boot"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

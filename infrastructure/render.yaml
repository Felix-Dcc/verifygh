# Render blueprint: web + worker + beat + Postgres + Redis.
#
# Secrets are marked `sync: false` and must be set in the dashboard.
# Nothing sensitive belongs in this file.

databases:
  - name: verifygh-db
    databaseName: verifygh
    user: verifygh
    # Standard or above, for point-in-time recovery. The ledger is the business.
    plan: standard
    postgresMajorVersion: "16"

services:
  - type: redis
    name: verifygh-redis
    plan: standard
    # The Celery queue must never be evicted to reclaim memory.
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: verifygh-api
    runtime: python
    plan: standard
    rootDir: backend
    healthCheckPath: /health/
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: >
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
      --workers 3 --threads 2 --timeout 60 --graceful-timeout 30
      --max-requests 1000 --max-requests-jitter 100
      --access-logfile - --error-logfile -
    envVars: &backend_env
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: verifygh-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: verifygh-redis
          type: redis
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: DB_SSLMODE
        value: require
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: None
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      # Render's load balancer is one proxy hop. Wrong here = spoofable rate limits.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Inert until official TextVerified docs + authorisation are in hand:
      # its endpoints are blank, so nothing is listed and nothing is sold.
      - key: VERIFICATION_PROVIDER
        value: textverified
      # --- set these in the dashboard ---
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_COOKIE_DOMAIN
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TEXTVERIFIED_API_KEY
        sync: false
      - key: TEXTVERIFIED_BASE_URL
        sync: false
      - key: EXCHANGE_RATE_PROVIDER
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
      - key: EXCHANGE_RATE_API_URL
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: worker
    name: verifygh-worker
    runtime: python
    plan: standard
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info --concurrency=4 --max-tasks-per-child=200
    envVars: *backend_env

  - type: worker
    name: verifygh-beat
    runtime: python
    plan: starter
    rootDir: backend
    # Keep this at a single instance. Two beats double every periodic task.
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat -l info
    envVars: *backend_env
